# pics.collage on dev2: the Moshpit origin vhost for a static PWA. Installed as
# /etc/moshpit/templates/pics.collage.conf so setup-origin.sh / moshpit-renew keep
# it on every renewal (NAME is replaced with the name). Certs are riotcoder's:
# /etc/ssl/moshpit-riotcoder, renewed by moshpit-renew-riotcoder.timer.
#
# Port 80 serves the site too (no redirect): a stock browser cannot check a
# Moshpit certificate, and the pit.world relay connects over TLS anyway.
# No access log: there is nothing to learn about a visitor, so keep nothing.

server {
    listen 80;
    listen [::]:80;
    server_name NAME;
    access_log off;
    error_log  /var/log/nginx/NAME.error.log warn;
    include /etc/nginx/snippets/pics-collage-static.conf;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name NAME;

    ssl_certificate     /etc/ssl/moshpit-riotcoder/NAME.crt;
    ssl_certificate_key /etc/ssl/moshpit-riotcoder/NAME.key;
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_conf_command Groups X25519MLKEM768:X25519:P-256;
    ssl_session_tickets off;
    ssl_session_cache shared:MoshpitSSL:10m;
    # No HSTS: a promise about a name the public DNS does not own.

    access_log off;
    error_log  /var/log/nginx/NAME.error.log warn;
    include /etc/nginx/snippets/pics-collage-static.conf;
}
