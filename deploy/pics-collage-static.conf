# Shared by both server blocks of pics.collage (/etc/nginx/snippets/pics-collage-static.conf).
root /var/www/pics.collage;
index index.html;
gzip on;
gzip_types text/css application/javascript application/manifest+json image/svg+xml;

location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
}

# The service worker and the page revalidate every time so an update reaches
# phones; everything else is versioned by the worker's cache.
location = /sw.js {
    add_header Cache-Control "no-cache";
}

location ~* \.(png|svg)$ {
    add_header Cache-Control "public, max-age=604800";
}

location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
}

location ~ /\. {
    deny all;
}
